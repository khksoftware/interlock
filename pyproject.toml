[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
# NOTE: this is the ONE place the distribution (PyPI-facing) name is declared -- deliberately
# kept out of every other file so it is trivially changeable without a scattered rename. The
# import package and the CLI command are both `interlock` regardless of what this name ends
# up being; only this one field would need to change if the name below turns out to be taken
# on a public index (unchecked as of this release -- see RELEASE_PROCESS.md).
name = "interlock"
dynamic = ["version"]
description = "Interlock -- a constraint that cannot be forgotten, because the action will not proceed. Git-action and agent-turn boundary checks, one install-and-arm discipline."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
interlock = "interlock.cli:main"

[tool.setuptools.dynamic]
version = { attr = "interlock.__version__" }

[project.urls]
Homepage = "https://example.invalid/interlock"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
